<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>عرض ملف myfile.pdf</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #525659; /* لون خلفية برامج PDF الشهيرة */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    
    .pdf-container {
      width: 90%;
      height: 95vh;
      border: none;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <!-- يفتح الملف myfile.pdf مع فتح شريط الصفحات والأدوات تلقائياً -->
  <iframe 
    class="pdf-container" 
    src="myfile.pdf#page=1&view=FitH" 
    type="application/pdf">
  </iframe>

</body>
</html>
